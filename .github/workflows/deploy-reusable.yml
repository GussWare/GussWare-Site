name: Reusable deployment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment destino
        required: true
        type: string
      astro-mode:
        description: Modo de build de Astro
        required: true
        type: string

jobs:
  deploy:
    name: Publicar en ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      POSTMAN_APP_USERNAME: ${{ secrets.POSTMAN_APP_USERNAME }}
      POSTMAN_APP_PASSWORD: ${{ secrets.POSTMAN_APP_PASSWORD }}
      WP_BUILD_STRICT: 'true'
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
      SFTP_HOST: ${{ vars.HOSTINGER_SFTP_HOST }}
      SFTP_PORT: ${{ vars.HOSTINGER_SFTP_PORT }}
      SFTP_DIR: ${{ vars.HOSTINGER_SFTP_DIR }}

    steps:
      - name: Checkout del commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Comprobar la configuración
        run: |
          set -euo pipefail
          for value in WORDPRESS_URL SITE_URL SSH_PRIVATE_KEY SSH_KNOWN_HOSTS \
                       SFTP_USER SFTP_HOST SFTP_PORT SFTP_DIR; do
            if [ -z "${!value}" ]; then
              echo "Falta la configuración del Environment ${{ inputs.environment }}: $value"
              exit 1
            fi
          done
          if ! [[ "$SFTP_PORT" =~ ^[0-9]+$ ]] || \
             [ "$SFTP_PORT" -lt 1 ] || [ "$SFTP_PORT" -gt 65535 ]; then
            echo "SFTP_PORT debe contener un puerto SSH válido (1-65535)."
            exit 1
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build estático (${{ inputs.astro-mode }})
        run: npm run build -- --mode ${{ inputs.astro-mode }}

      - name: Comprobar la salida
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.htaccess
          test ! -d dist/server
          test ! -d dist/client

      - name: Publicar mediante rsync sobre SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          # Sin --delete: no se elimina contenido remoto. Las páginas
          # retiradas permanecen hasta autorizar una limpieza explícita.
          rsync -az --checksum \
            -e "ssh -p ${SFTP_PORT} -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ "${SFTP_USER}@${SFTP_HOST}:${SFTP_DIR}/"

      - name: Verificar el sitio publicado
        run: |
          set -euo pipefail
          for path in / /en/ /servicios/ /contact/ /robots.txt /sitemap-index.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}${path}")
            echo "${path} -> ${code}"
            test "$code" = "200"
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}/ruta-inexistente-de-prueba/")
          echo "/ruta-inexistente-de-prueba/ -> ${code}"
          test "$code" = "404"
