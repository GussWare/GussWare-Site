name: Deploy production

# Despliegue del sitio estático de https://gussware.dev mediante rsync sobre SSH.
#
# Entorno: GitHub Environment `production`.
# Modo Astro: `production`, conectado al CMS de producción.
# La configuración se obtiene de las variables y secretos del Environment.
# No intervienen archivos `.env` durante el build de GitHub Actions.
#
# La rama `main` es la única que despliega:
# - Un push a main dispara el despliegue.
# - Un pull request mergeado a main dispara el despliegue mediante ese push.
# - Un pull request abierto o actualizado no despliega.
# - workflow_dispatch solo ejecuta el job desde main.
#
# CONFIGURACIÓN (Settings → Environments → production):
#   vars.WORDPRESS_URL                 https://cms.gussware.dev
#   vars.SITE_URL                      https://gussware.dev
#   vars.HOSTINGER_SFTP_HOST           Host del hosting
#   vars.HOSTINGER_SFTP_PORT           Puerto SSH del hosting (normalmente 22)
#   vars.HOSTINGER_SFTP_DIR            Directorio remoto de publicación
#                                      (p. ej. /public_html)
#   secrets.HOSTINGER_SFTP_USER        Usuario del hosting
#   secrets.HOSTINGER_SSH_PRIVATE_KEY  Clave privada SSH
#   secrets.HOSTINGER_SSH_KNOWN_HOSTS  Clave pública del host
#                                      (ssh-keyscan -p <puerto> <host>)
#
# IMPORTANTE:
# - El mecanismo de transferencia es rsync sobre SSH, no el protocolo SFTP.
# - No se utiliza --delete para evitar eliminar contenido remoto.
# - La migración inicial requiere backup y preparación previa de public_html.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar en producción
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    env:
      WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      WP_BUILD_STRICT: "true"
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
      SFTP_HOST: ${{ vars.HOSTINGER_SFTP_HOST }}
      SFTP_PORT: ${{ vars.HOSTINGER_SFTP_PORT }}
      SFTP_DIR: ${{ vars.HOSTINGER_SFTP_DIR }}

    steps:
      - name: Comprobar la configuración
        run: |
          set -euo pipefail

          for value in WORDPRESS_URL SITE_URL SSH_PRIVATE_KEY SSH_KNOWN_HOSTS \
                       SFTP_USER SFTP_HOST SFTP_PORT SFTP_DIR; do
            if [ -z "${!value}" ]; then
              echo "Falta la configuración del Environment production: $value"
              exit 1
            fi
          done

          if ! [[ "$SFTP_PORT" =~ ^[0-9]+$ ]] || \
             [ "$SFTP_PORT" -lt 1 ] || [ "$SFTP_PORT" -gt 65535 ]; then
            echo "SFTP_PORT debe contener un puerto SSH válido (1-65535)."
            exit 1
          fi

          echo "WORDPRESS_URL=${WORDPRESS_URL}"
          echo "SITE_URL=${SITE_URL}"
          echo "Directorio de publicación: ${SFTP_DIR}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build estático (production)
        run: npm run build -- --mode production

      - name: Comprobar la salida
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.htaccess
          test ! -d dist/server
          test ! -d dist/client

      - name: Publicar mediante rsync sobre SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy

          # Sin --delete: no se elimina contenido remoto.
          # Las páginas retiradas permanecen hasta autorizar una limpieza.
          rsync -az --checksum \
            -e "ssh -p ${SFTP_PORT} -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            dist/ "${SFTP_USER}@${SFTP_HOST}:${SFTP_DIR}/"

      - name: Verificar el sitio publicado
        run: |
          set -euo pipefail

          for path in / /en/ /servicios/ /contact/ /robots.txt /sitemap-index.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}${path}")
            echo "${path} -> ${code}"
            test "$code" = "200"
          done

          # Una URL inexistente debe devolver HTTP 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}/ruta-inexistente-de-prueba/")
          echo "/ruta-inexistente-de-prueba/ -> ${code}"
          test "$code" = "404"
