name: CI

# Validación y despliegue del modelo estático (SSG): lint, build sin runtime
# de Node y pruebas contra el sitio generado.
#
#   push a `staging` o `main`        → CI y despliegue de la rama destino
#   pull request → `staging` o `main` → CI (sin desplegar)
#   workflow_dispatch                → CI y despliegue de la rama seleccionada
#
# Entorno: GitHub Environment `ci-staging` (solo acceso de lectura al CMS).
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' }}

jobs:
  build:
    name: Build estático y pruebas
    runs-on: ubuntu-latest

    environment:
      name: ci-staging
      deployment: false

    env:
      ASTRO_MODE: staging
      WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      POSTMAN_APP_USERNAME: ${{ secrets.POSTMAN_APP_USERNAME }}
      POSTMAN_APP_PASSWORD: ${{ secrets.POSTMAN_APP_PASSWORD }}
      WP_BUILD_STRICT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build estático (${{ env.ASTRO_MODE }})
        run: npm run build -- --mode ${{ env.ASTRO_MODE }}

      - name: Comprobar que la salida es desplegable sin Node
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/500.html
          test -f dist/robots.txt
          test -f dist/sitemap-index.xml
          test -f dist/sitemap-0.xml
          test -f dist/.htaccess
          test ! -d dist/server
          test ! -d dist/client
          ! grep -q 'localhost' dist/sitemap-0.xml

      - name: Comprobar el favicon y el logo del footer (desde WordPress)
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("dist/index.html", "utf8");
            const icon = html.match(/<link rel="icon"[^>]*href="([^"]+)"/);
            if (!icon) {
              console.error("El HTML generado no incluye el favicon de WordPress");
              process.exit(1);
            }

            if (!/^https?:\/\//.test(icon[1])) {
              console.error("El favicon no se resuelve desde WordPress: " + icon[1]);
              process.exit(1);
            }

            const footerStart = html.indexOf("<footer");

            if (footerStart === -1) {
              console.error("El HTML generado no incluye el footer");
              process.exit(1);
            }

            const logo = html.slice(footerStart).match(/<img[^>]*src="([^"]+)"/);

            if (!logo) {
              console.error("El footer generado no incluye el logo de WordPress");
              process.exit(1);
            }

            if (!/^https?:\/\//.test(logo[1])) {
              console.error("El logo del footer no se resuelve desde WordPress: " + logo[1]);
              process.exit(1);
            }

            console.log("Favicon: " + icon[1]);
            console.log("Logo del footer: " + logo[1]);
          '

      - name: Pruebas
        run: |
          set -euo pipefail
          preview_log=$(mktemp)
          npx astro preview --port 4321 > "$preview_log" 2>&1 &
          preview_pid=$!

          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
            rm -f "$preview_log"
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4321/ > /dev/null; then
              echo 'Preview listo'
              npm test
              exit 0
            fi
            sleep 1
          done

          cat "$preview_log"
          exit 1

  deploy-staging:
    name: Publicar en staging
    needs: build
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/staging' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: staging
      astro-mode: staging
    secrets: inherit

  deploy-production:
    name: Publicar en producción
    needs: build
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: production
      astro-mode: production
    secrets: inherit
